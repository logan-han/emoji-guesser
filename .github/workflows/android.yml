name: Android CI/CD

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_run:
    workflows: ["CI/CD"]
    types:
      - completed
    branches:
      - main

env:
  JAVA_VERSION: '17'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./android

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew test --stacktrace

      - name: Upload Test Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: android/app/build/reports/tests/
          retention-days: 7

  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./android

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Lint
        run: ./gradlew lint --stacktrace

      - name: Upload Lint Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-reports
          path: android/app/build/reports/lint-results*.html
          retention-days: 7

  build:
    needs: [test, lint]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./android

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 7

  release:
    needs: [test, lint]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    defaults:
      run:
        working-directory: ./android

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for scripts
        run: chmod +x gradlew generate-keystore.sh

      - name: Generate Keystore
        run: ./generate-keystore.sh

      - name: Get WebSocket URL from Backend
        id: backend
        env:
          SERVERLESS_ACCESS_KEY: ${{ secrets.SERVERLESS_ACCESS_KEY }}
        run: |
          cd ../backend
          yarn install --frozen-lockfile
          WS_URL=$(npx sls info --stage prod --json 2>/dev/null | jq -r '.info.endpoints[0]' || echo "")
          if [ -z "$WS_URL" ] || [ "$WS_URL" = "null" ]; then
            WS_URL="${{ secrets.WS_URL }}"
          fi
          echo "ws_url=$WS_URL" >> $GITHUB_OUTPUT
          echo "WebSocket URL: $WS_URL"
        continue-on-error: true

      - name: Get Version Info
        id: version
        run: |
          VERSION_CODE=$(date +%Y%m%d%H)
          VERSION_NAME="1.0.$(git rev-list --count HEAD)"
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT

      - name: Build Release AAB
        env:
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          WS_URL: ${{ steps.backend.outputs.ws_url || secrets.WS_URL }}
        run: ./gradlew bundleRelease --stacktrace

      - name: Build Release APK
        env:
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          WS_URL: ${{ steps.backend.outputs.ws_url || secrets.WS_URL }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 30

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Upload to Play Store
        if: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON != '' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
          packageName: com.emojiguesser
          releaseFiles: android/app/build/outputs/bundle/release/*.aab
          track: internal
          status: completed
          changesNotSentForReview: false
