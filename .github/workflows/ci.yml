
name: CI/CD

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Frontend Dependencies
        run: yarn install --frozen-lockfile
        working-directory: ./frontend

      - name: Run Frontend Tests
        run: yarn test --coverage --watchAll=false
        working-directory: ./frontend

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: frontend
          name: frontend-coverage

      - name: Frontend Type Check
        run: yarn tsc --noEmit
        working-directory: ./frontend

      - name: Install Backend Dependencies
        run: yarn install --frozen-lockfile
        working-directory: ./backend

      - name: Backend Type Check
        run: yarn tsc --noEmit
        working-directory: ./backend

  deploy-backend:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-4

      - name: Install Backend Dependencies
        run: yarn install --frozen-lockfile
        working-directory: ./backend

      - name: Deploy Backend
        env:
          SERVERLESS_ACCESS_KEY: ${{ secrets.SERVERLESS_ACCESS_KEY }}
        run: yarn sls deploy --stage prod
        working-directory: ./backend

      - name: Get WebSocket URL
        env:
          SERVERLESS_ACCESS_KEY: ${{ secrets.SERVERLESS_ACCESS_KEY }}
        id: websocket-url
        run: |
          WS_URL=$(npx sls info --stage prod --json | jq -r '.info.endpoints[0]')
          echo "Extracted WebSocket URL: $WS_URL"
          echo "ws_url=$WS_URL" >> $GITHUB_OUTPUT
        working-directory: ./backend

    outputs:
      websocket-url: ${{ steps.websocket-url.outputs.ws_url }}

  deploy-frontend:
    needs: [test, deploy-backend]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Frontend Dependencies
        run: yarn install --frozen-lockfile
        working-directory: ./frontend

      - name: Build Frontend
        env:
          REACT_APP_WS_URL: ${{ needs.deploy-backend.outputs.websocket-url }}
        run: yarn build
        working-directory: ./frontend

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-4

      - name: Deploy to S3
        run: |
          aws s3 sync build/ s3://${{ secrets.S3_BUCKET_NAME }} --delete
        working-directory: ./frontend

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} --paths "/*"
